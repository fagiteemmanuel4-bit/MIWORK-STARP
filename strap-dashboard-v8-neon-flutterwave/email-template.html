<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:32px 12px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;background:#ffffff;border:1px solid #e4e4e7;border-radius:18px;overflow:hidden">
          <tr>
            <td style="padding:28px 32px;background:#111111;color:#ffffff">
              <div style="font-size:22px;font-weight:700;letter-spacing:-.5px">Strap<span style="color:#f97316">.</span></div>
              <div style="margin-top:7px;color:#d4d4d8;font-size:13px">Your business, moving forward.</div>
            </td>
          </tr>
          <tr>
            <td style="padding:34px 32px 12px">
              <p style="margin:0 0 12px;font-size:15px;color:#52525b">Hello {{to_name}},</p>
              <h1 style="margin:0 0 14px;font-size:25px;line-height:1.25;letter-spacing:-.6px;color:#18181b">{{subject}}</h1>
              <p style="margin:0;color:#52525b;font-size:15px;line-height:1.7">{{message}}</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:22px 32px 18px">
              <div style="display:inline-block;min-width:210px;padding:18px 24px;border:1px solid #e4e4e7;border-radius:14px;background:#fafafa;color:#111111;font-size:34px;font-weight:700;letter-spacing:10px;text-align:center">{{otp_code}}</div>
              <p style="margin:14px 0 0;color:#71717a;font-size:13px">This code expires at {{expiry_time}}.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:10px 32px 30px">
              <div style="height:1px;background:#e4e4e7"></div>
              <p style="margin:20px 0 0;color:#71717a;font-size:12px;line-height:1.7">If you did not request this code, you can safely ignore this email. Never share your verification code with anyone.</p>
              <p style="margin:18px 0 0;color:#a1a1aa;font-size:11px">© {{app_name}}. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
