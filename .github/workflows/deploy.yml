name: Strap Cloudflare Preview

on:
  push:
    branches:
      - cloudflare-preview
    paths:
      - "strap-dashboard-v8-neon-flutterwave/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strap-cloudflare-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strap-dashboard-v8-neon-flutterwave
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: node --check server.mjs

      - name: Create Cloudflare preview
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@latest preview --name strap-preview --worker-name miwork-starp --json)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e00174af8acd4774a87dde93f0f13b58

      - name: Set preview session secret
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          printf '%s' "$secret" | npx --yes wrangler@latest preview secret put SESSION_SECRET --name strap-preview --worker-name miwork-starp
          unset secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e00174af8acd4774a87dde93f0f13b58

      - name: Probe preview health and static app
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "$PREVIEW_URL/api/health"
          echo
          curl --fail --show-error --silent "$PREVIEW_URL/" | grep -qi "<html"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
