name: Strap Cloudflare Preview

on:
  push:
    branches:
      - cloudflare-preview
    paths:
      - "strap-dashboard-v8-neon-flutterwave/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strap-cloudflare-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strap-dashboard-v8-neon-flutterwave
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check server syntax
        run: npm run check

      - name: Deploy isolated preview Worker
        id: preview
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --name strap-preview
          echo "url=https://strap-preview.strap-preview.workers.dev" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e00174af8acd4774a87dde93f0f13b58

      - name: Probe preview health and static app
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --retry 5 --retry-delay 3 --retry-connrefused --show-error --silent "$PREVIEW_URL/api/health")"
          printf "%s\\n" "$health"
          printf "%s" "$health" | grep -q '"database":"connected"'
          curl --fail --show-error --silent "$PREVIEW_URL/" | grep -qi "<html"
          echo "Diagnosing dashboard HTML route"
          dashboard_status="$(curl --silent --show-error --output /tmp/strap-dashboard.html --dump-header /tmp/strap-dashboard.headers --write-out "%{http_code}" "$PREVIEW_URL/dashboard.html")"
          echo "GET /dashboard.html -> HTTP $dashboard_status"
          sed -n '1,12p' /tmp/strap-dashboard.headers
          head -c 500 /tmp/strap-dashboard.html || true
          echo
          for path in /dashboard.html/ /dashboard /index.html /dashboard.js /features.js; do
            code="$(curl --silent --show-error --output /tmp/strap-route-body --write-out "%{http_code}" "$PREVIEW_URL$path")"
            echo "GET $path -> HTTP $code"
          done
          test "$dashboard_status" = "200"
          grep -q "dashboard.js?v=20261119-dashboard-fix" /tmp/strap-dashboard.html
          echo "Checking dashboard feature asset"
          curl --fail --show-error --silent "$PREVIEW_URL/features.js?v=20261119-dashboard-fix" -o /tmp/strap-features.js
          grep -q "S.notifs = Array.isArray" /tmp/strap-features.js
          curl --fail --show-error --silent "$PREVIEW_URL/api/config" | grep -q '"emailProvider":"Neon Auth"'
          curl --fail --show-error --silent "$PREVIEW_URL/script.js" | grep -q '0x4AAAAAAGIY0URD6s_Mg1m1'
          status="$(curl --silent --output /dev/null --write-out "%{http_code}" -X POST -H 'Content-Type: application/json' -d '{}' "$PREVIEW_URL/api/auth/register")"
          test "$status" = "403"
          status="$(curl --silent --output /dev/null --write-out "%{http_code}" "$PREVIEW_URL/api/auth/me")"
          test "$status" = "401"
          for path in .env server.mjs package.json; do
            status="$(curl --silent --output /dev/null --write-out "%{http_code}" "$PREVIEW_URL/$path")"
            test "$status" = "404"
          done
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
